# ===== Serveur (meme port que le workshop : http://localhost:86) =====
server.port=9090
# ===== Base de donnees : XAMPP MySQL/MariaDB, port 3607 =====
spring.datasource.url=jdbc:mysql://<DB_HOST>:<DB_PORT>/<DB_NAME>?useSSL=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}


# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=true
spring.jackson.serialization.write-dates-as-timestamps=false

# ===== JWT =====
# duree de validite en secondes (5h comme dans le workshop)
jwt.expiration=18000
jwt.secret=clm2026ClinicManagerSecretKeyChangeMeInProduction

# ===== CORS (Angular) =====
clm.cors.origins=http://localhost:4200

# ===== Emails =====
# clm.mail.enabled=false : les emails sont seulement ecrits dans la console
clm.mail.enabled=${CLM_MAIL_ENABLED:false}
clm.admin.email=${CLM_ADMIN_EMAIL:admin@clinic.tn}
spring.mail.host=${CLM_SMTP_HOST:smtp.gmail.com}
spring.mail.port=${CLM_SMTP_PORT:587}
spring.mail.username=${CLM_SMTP_USERNAME:}
spring.mail.password=${CLM_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===== Comptes crees au premier demarrage =====
clm.init.admin.email=${CLM_INIT_ADMIN_EMAIL:admin@clinic.tn}
clm.init.admin.password=${CLM_INIT_ADMIN_PASSWORD:admin123}
clm.init.secretaire.email=${CLM_INIT_SECRETAIRE_EMAIL:secretaire@clinic.tn}
clm.init.secretaire.password=${CLM_INIT_SECRETAIRE_PASSWORD:secret123}
